<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN TOKENS — colors, type, spacing
     ============================================================ */
  :root {
    --bg:        #0e0f11;
    --surface:   #161719;
    --border:    #252729;
    --text:      #e8e9ea;
    --muted:     #7a7d82;
    --accent:    #f97316;   /* orange — matches "bits to systems" brand */
    --accent2:   #3b82f6;   /* blue for secondary accents */
    --green:     #22c55e;
    --font-head: 'Space Grotesk', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --radius:    8px;
    --max:       1100px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-head);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; border-radius: var(--radius); }

  /* ---- LAYOUT ---- */
  .container { max-width: var(--max); margin: 0 auto; padding: 0 24px; }

  /* ---- NAV ---- */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(14,15,17,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    max-width: var(--max); margin: 0 auto; padding: 0 24px; height: 60px;
  }
  .nav-logo {
    font-family: var(--font-mono);
    font-size: 15px; font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a {
    font-size: 14px; color: var(--muted);
    transition: color .2s;
  }
  .nav-links a:hover { color: var(--text); }

  /* ---- HERO ---- */
  .hero {
    padding: 96px 0 80px;
    border-bottom: 1px solid var(--border);
  }
  .hero-inner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 64px;
    align-items: center;
    max-width: var(--max); margin: 0 auto; padding: 0 24px;
  }
  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--green);
    letter-spacing: 2px; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 20px;
  }
  .hero-eyebrow::before {
    content: ''; width: 6px; height: 6px;
    background: var(--green); border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px var(--green);
  }
  .hero h1 {
    font-size: clamp(36px, 5vw, 58px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -2px;
    margin-bottom: 24px;
  }
  .hero h1 .accent-orange { color: var(--accent); }
  .hero h1 .accent-blue   { color: var(--accent2); }
  .hero-bio {
    font-size: 17px; color: var(--muted);
    line-height: 1.7; margin-bottom: 36px;
    max-width: 460px;
  }
  .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 32px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 24px; border-radius: var(--radius);
    font-family: var(--font-head); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .2s;
    border: none;
  }
  .btn-primary {
    background: var(--accent); color: #fff;
  }
  .btn-primary:hover { background: #ea6c10; transform: translateY(-1px); }
  .btn-ghost {
    background: transparent; color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--muted); background: var(--surface); }
  .hero-meta {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--muted); display: flex; gap: 20px;
  }
  .hero-meta span { display: flex; align-items: center; gap: 6px; }
  .dot-status {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px var(--green);
    display: inline-block;
  }

  /* hero image side */
  .hero-image-side {
    position: relative;
    display: flex; justify-content: center; align-items: center;
  }
  .hero-image-frame {
    width: 100%; aspect-ratio: 4/3;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted);
    font-family: var(--font-mono); font-size: 13px;
    text-align: center; gap: 12px;
    position: relative; overflow: hidden;
  }
  .hero-image-frame img {
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 12px;
  }
  .hero-image-frame .placeholder-text { position: absolute; }
  .hero-image-frame img + .placeholder-text { display: none; }
  .circuit-tag {
    position: absolute; bottom: 16px; right: 16px;
    background: rgba(14,15,17,0.8);
    border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--muted); line-height: 1.6;
  }

  /* ---- SECTION HELPERS ---- */
  section { padding: 80px 0; border-bottom: 1px solid var(--border); }
  .section-eyebrow {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 12px;
  }
  .section-title {
    font-size: clamp(24px, 3vw, 36px);
    font-weight: 700; letter-spacing: -1px;
    margin-bottom: 8px;
  }
  .section-sub {
    font-size: 15px; color: var(--muted); margin-bottom: 48px;
  }

  /* ---- PATHS GRID ---- */
  .paths-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .path-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 24px;
    transition: border-color .2s, transform .2s;
    display: flex; flex-direction: column; gap: 12px;
  }
  .path-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .path-icon {
    width: 44px; height: 44px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .path-card h3 { font-size: 16px; font-weight: 600; }
  .path-card p { font-size: 14px; color: var(--muted); line-height: 1.6; flex: 1; }
  .path-link {
    font-family: var(--font-mono); font-size: 12px;
    display: flex; align-items: center; gap: 6px;
    transition: gap .2s;
  }
  .path-link:hover { gap: 10px; }

  /* ---- PROJECTS ---- */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }
  .project-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    transition: border-color .2s, transform .2s;
    display: flex; flex-direction: column;
  }
  .project-card:hover {
    border-color: var(--accent2);
    transform: translateY(-2px);
  }
  .project-img {
    width: 100%; aspect-ratio: 16/9;
    background: var(--border);
    object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 12px; color: var(--muted);
    position: relative;
  }
  .project-img img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 0;
  }
  .project-img .img-placeholder {
    position: absolute;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .project-img img + .img-placeholder { display: none; }
  .project-body { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .project-status {
    font-family: var(--font-mono); font-size: 11px;
    display: flex; align-items: center; gap: 6px;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .status-dot.active  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.wip     { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.done    { background: var(--muted); }
  .project-body h3 { font-size: 17px; font-weight: 600; }
  .project-body p { font-size: 14px; color: var(--muted); line-height: 1.6; flex: 1; }
  .project-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-family: var(--font-mono); font-size: 11px;
    background: var(--border); color: var(--muted);
    padding: 3px 10px; border-radius: 999px;
  }
  .project-links { display: flex; gap: 12px; padding-top: 4px; }
  .project-links a {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--accent2);
    display: flex; align-items: center; gap: 4px;
    transition: color .15s;
  }
  .project-links a:hover { color: var(--text); }

  /* ---- BLOG ---- */
  .blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .blog-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    transition: border-color .2s, transform .2s;
    display: flex; flex-direction: column;
  }
  .blog-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .blog-thumb {
    width: 100%; aspect-ratio: 16/9;
    background: var(--border);
    object-fit: cover;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .blog-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 0; }
  .blog-thumb .thumb-placeholder {
    position: absolute;
    font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  }
  .blog-thumb img + .thumb-placeholder { display: none; }
  .blog-date {
    position: absolute; top: 12px; left: 12px;
    background: rgba(14,15,17,0.85);
    border-radius: 4px; padding: 4px 8px;
    font-family: var(--font-mono); font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .blog-body { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .blog-body h3 { font-size: 16px; font-weight: 600; line-height: 1.4; }
  .blog-body p { font-size: 14px; color: var(--muted); line-height: 1.6; flex: 1; }
  .blog-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .read-link {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--accent);
    display: flex; align-items: center; gap: 6px;
    transition: gap .15s;
    width: fit-content;
  }
  .read-link:hover { gap: 10px; }

  /* ---- FOOTER ---- */
  footer {
    padding: 40px 0 32px;
  }
  .footer-inner {
    max-width: var(--max); margin: 0 auto; padding: 0 24px;
    display: flex; flex-direction: column; gap: 24px; align-items: center;
    text-align: center;
  }
  .footer-tagline { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; }
  .footer-tagline span { color: var(--accent); }
  .social-links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .social-links a {
    font-family: var(--font-mono); font-size: 13px;
    color: var(--muted);
    display: flex; align-items: center; gap: 8px;
    transition: color .2s;
    padding: 8px 16px; border: 1px solid var(--border);
    border-radius: 6px;
  }
  .social-links a:hover { color: var(--text); border-color: var(--muted); }
  .footer-copy { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  /* ---- RESPONSIVE ---- */
  @media (max-width: 720px) {
    .hero-inner { grid-template-columns: 1fr; gap: 40px; }
    .hero-image-side { order: -1; }
    .hero-image-frame { aspect-ratio: 3/2; }
    .nav-links { gap: 18px; }
  }
  @media (max-width: 480px) {
    .nav-links { display: none; }
    .hero { padding: 60px 0 48px; }
  }

  /* ---- SECTION HEADER ROW ---- */
  .section-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 40px; flex-wrap: wrap; gap: 16px;
  }
  .section-header-left .section-title { margin-bottom: 0; }
  .view-all {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--accent2);
    display: flex; align-items: center; gap: 6px;
    transition: gap .15s; white-space: nowrap;
  }
  .view-all:hover { gap: 10px; }
</style>
</head>
<body>

// ---- BUILD THE PAGE ----
document.addEventListener("DOMContentLoaded", () => {

  document.title = SITE.name + " The Map";

  // NAV
  document.getElementById("nav-logo").innerHTML =
    `<span style="color:var(--accent)">&lt;</span>${SITE.name}<span style="color:var(--accent)">/&gt;</span>`;

  }
  document.getElementById("blog-grid").innerHTML = SITE.blogPosts.map(b => `
    <a href="${b.href || '#'}" class="blog-card">
      <div class="blog-thumb" style="position:relative">
        ${b.image ? `<img src="${b.image}" alt="${b.title}">` : ""}
        <div class="thumb-placeholder">📷 thumbnail</div>
        <div class="blog-date">${b.date}</div>
      </div>
      <div class="blog-body">
        <h3>${b.title}</h3>
        <p>${b.excerpt}</p>
        <div class="blog-tags">${b.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
        <span class="read-link">Read post →</span>
      </div>
    </a>
  `).join("");

  // FOOTER
  document.getElementById("footer-tagline").innerHTML =
    SITE.footerTagline.replace("silicon", `<span>silicon</span>`);
  document.getElementById("social-links").innerHTML = SITE.socials.map(s =>
    `<a href="${s.href}">${s.icon} ${s.label}</a>`
  ).join("");
  document.getElementById("footer-copy").textContent = SITE.copyright;
});
</script>
